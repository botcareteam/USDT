<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ads Orbit</title>


<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>


<!-- Adexium -->
<script
type="text/javascript"
src="https://cdn.tgads.space/assets/js/adexium-widget.min.js">
</script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const status =
      document.getElementById("status");


    try{

      window.adexiumWidget =
        new AdexiumWidget({

          wid:
          "6cc4bbab-f00d-4ba8-ba06-206215aeeb3b",

          adFormat:
          "interstitial"

        });


      /*
        Official Adexium
        automatic mode
      */

      window.adexiumWidget.autoMode();


      status.className =
        "status success";

      status.textContent =
        "Adexium initialized ✅";


    }catch(error){

      console.log(
        "Adexium error:",
        error
      );

      status.className =
        "status error";

      status.textContent =
        "Adexium initialization failed ❌";

    }

  }
);

</script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #202633;
}

.home{
  padding:20px;
}

.balanceBox{
  background:#111722;
  border:1px solid #252d3a;
  border-radius:18px;
  padding:22px;
  text-align:center;
  margin-bottom:25px;
}

.balanceTitle{
  color:#9aa4b2;
  font-size:14px;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
}

.network{
  color:#7f8998;
  font-size:12px;
}

.sectionTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.adCard{
  background:#111722;
  border:1px solid #2a3342;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  cursor:pointer;
}

.adCard:active{
  transform:scale(.98);
}

.adTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.adTitle{
  font-size:16px;
  font-weight:bold;
}

.adIcon{
  font-size:28px;
}

.adText{
  color:#9da7b5;
  font-size:13px;
  margin-top:10px;
  line-height:1.5;
}

.adButton{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#20d889;
  color:#06100b;
  font-weight:bold;
}

.status{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  line-height:1.5;
}

.success{
  color:#58e39b;
}

.error{
  color:#ff7070;
}

</style>

</head>


<body>


<div class="header">
  ADS ORBIT / ONLINE
</div>


<div class="home">


  <!-- BALANCE -->

  <div class="balanceBox">

    <div class="balanceTitle">
      Total Earning
    </div>

    <div class="balance">
      <span id="balance">0.00</span>
      USDT
    </div>

    <div class="network">
      BEP20 Network
    </div>

  </div>


  <!-- ADS -->

  <div class="sectionTitle">
    📺 Ads Earning
  </div>


  <div
    class="adCard"
    onclick="requestAd()"
  >

    <div class="adTop">

      <div class="adTitle">
        Advertisement #1
      </div>

      <div class="adIcon">
        📺
      </div>

    </div>


    <div class="adText">
      Tap anywhere on this box to request
      an advertisement.
    </div>


    <button
      class="adButton"
      type="button"
    >
      WATCH AD
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    Initializing Adexium...
  </div>


</div>


<script>


/* =========================
   TELEGRAM READY
========================= */

if(
  window.Telegram &&
  window.Telegram.WebApp
){

  window.Telegram.WebApp.ready();

}


/* =========================
   AD REQUEST
========================= */

function requestAd(){

  const status =
    document.getElementById("status");


  /*
    Important:
    Adexium autoMode() is already
    controlling ad delivery.

    We don't call an undocumented
    showAd() function here.
  */

  if(
    window.adexiumWidget
  ){

    status.className =
      "status success";

    status.textContent =
      "Ad request sent. Waiting for Adexium...";

  }else{

    status.className =
      "status error";

    status.textContent =
      "Adexium is not initialized ❌";

  }

}

</script>


</body>

</html>
