<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ads Orbit</title>

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07090d;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  padding:25px 0;
}

.logo{
  font-size:42px;
}

.title{
  font-size:25px;
  font-weight:bold;
  margin-top:8px;
}

.card{
  background:#10141c;
  border:1px solid #202936;
  border-radius:18px;
  padding:22px;
  margin-top:18px;
}

.balance-title{
  color:#9ca8b8;
  font-size:14px;
}

.balance{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.coin{
  color:#20d889;
}

.ad-card{
  cursor:pointer;
  text-align:center;
  transition:.15s;
}

.ad-card:active{
  transform:scale(.97);
}

.ad-icon{
  font-size:42px;
}

.ad-title{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}

.ad-text{
  color:#8f9aaa;
  margin-top:7px;
}

.watch{
  margin-top:18px;
  background:#20d889;
  color:#06100b;
  border:0;
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#7f8a99;
  font-size:13px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🌐</div>
    <div class="title">ADS ORBIT</div>
  </div>

  <div class="card">
    <div class="balance-title">TOTAL EARNING</div>
    <div class="balance">
      <span class="coin">●</span> 0.00 USDT
    </div>
    <div class="balance-title">BEP20</div>
  </div>

  <div
    class="card ad-card"
    id="adButton"
  >

    <div class="ad-icon">🎁</div>

    <div class="ad-title">
      Watch Ad & Earn
    </div>

    <div class="ad-text">
      Tap here to watch advertisement
    </div>

    <button class="watch">
      WATCH AD
    </button>

  </div>

  <div class="status" id="status">
    Ready
  </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

  const adexiumAds = new AdexiumWidget({
    wid: "6cc4bbab-f00d-4ba8-ba06-206215aeeb3b",
    adFormat: "interstitial",
    debug: true
  });

  const adButton = document.getElementById("adButton");
  const status = document.getElementById("status");


  adButton.onclick = function(){

    status.innerText = "Loading advertisement...";

    adexiumAds.requestAd("interstitial");

  };


  adexiumAds.on("adReceived", function(ad){

    status.innerText = "Advertisement ready";

    adexiumAds.displayAd(ad);

  });


  adexiumAds.on("adDisplayed", function(){

    status.innerText = "Advertisement is playing...";

  });


  adexiumAds.on("adPlaybackCompleted", function(){

    status.innerText = "Advertisement completed ✓";

  });


  adexiumAds.on("adClosed", function(){

    status.innerText = "Ready";

  });


  adexiumAds.on("noAdFound", function(){

    status.innerText =
      "No ad available. Please try again.";

  });

});

</script>

</body>
</html>
