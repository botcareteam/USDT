<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ads Orbit - Adexium Test</title>


<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>


<!-- Adexium -->
<script
  type="text/javascript"
  src="https://cdn.tgads.space/assets/js/adexium-widget.min.js">
</script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #202633;
}

.home{
  padding:20px;
}

.balanceBox{
  background:#111722;
  border:1px solid #252d3a;
  border-radius:18px;
  padding:22px;
  text-align:center;
  margin-bottom:25px;
}

.balanceTitle{
  color:#9aa4b2;
  font-size:14px;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
}

.network{
  color:#7f8998;
  font-size:12px;
}

.sectionTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}


/* AD CARD */

.adCard{
  background:#111722;
  border:1px solid #2a3342;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  cursor:pointer;
  transition:.2s;
}

.adCard:active{
  transform:scale(.98);
}

.adTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.adTitle{
  font-size:16px;
  font-weight:bold;
}

.adIcon{
  font-size:28px;
}

.adText{
  color:#9da7b5;
  font-size:13px;
  margin-top:10px;
  line-height:1.5;
}

.adButton{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#20d889;
  color:#06100b;
  font-weight:bold;
  font-size:14px;
}

.status{
  text-align:center;
  margin-top:20px;
  color:#9da7b5;
  font-size:13px;
  line-height:1.5;
}

.success{
  color:#58e39b;
}

.error{
  color:#ff7070;
}

</style>

</head>


<body>


<div class="header">
  ADS ORBIT / ONLINE
</div>


<div class="home">


  <!-- BALANCE -->

  <div class="balanceBox">

    <div class="balanceTitle">
      Total Earning
    </div>

    <div class="balance">
      <span id="balance">0.00</span> USDT
    </div>

    <div class="network">
      BEP20 Network
    </div>

  </div>


  <!-- ADS -->

  <div class="sectionTitle">
    📺 Ads Earning
  </div>


  <!-- WHOLE CARD IS CLICKABLE -->

  <div
    class="adCard"
    id="adCard"
    onclick="watchAd()"
  >

    <div class="adTop">

      <div class="adTitle">
        Advertisement #1
      </div>

      <div class="adIcon">
        📺
      </div>

    </div>


    <div class="adText">
      Watch this advertisement to continue.
      Tap anywhere on this card.
    </div>


    <button
      class="adButton"
      id="adButton"
      type="button"
    >
      WATCH AD
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    Adexium is initializing...
  </div>


</div>


<script>


/* =================================
   TELEGRAM
================================= */

if(
  window.Telegram &&
  window.Telegram.WebApp
){

  window.Telegram.WebApp.ready();

}


/* =================================
   ADEIXUM
================================= */

let adexiumWidget=null;

let adReady=false;

let adLoading=false;


/* =================================
   INITIALIZE
================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const status=
      document.getElementById("status");


    try{

      adexiumWidget =
        new AdexiumWidget({

          wid:
            "6cc4bbab-f00d-4ba8-ba06-206215aeeb3b",

          adFormat:
            "interstitial"

        });


      /*
        Start Adexium automatic mode
      */

      adexiumWidget.autoMode();


      adReady=true;


      status.className=
        "status success";

      status.textContent=
        "Adexium initialized ✅";


    }catch(error){

      console.log(
        "Adexium initialization error:",
        error
      );


      status.className=
        "status error";

      status.textContent=
        "Adexium initialization failed ❌";

    }

  }
);


/* =================================
   WATCH AD
================================= */

function watchAd(){

  if(adLoading){

    return;

  }


  const button=
    document.getElementById("adButton");

  const card=
    document.getElementById("adCard");

  const status=
    document.getElementById("status");


  if(!adReady){

    status.className=
      "status error";

    status.textContent=
      "Ad is not ready yet. Please try again.";

    return;

  }


  adLoading=true;

  button.disabled=true;

  button.textContent=
    "OPENING AD...";

  card.style.opacity=
    "0.7";

  status.className=
    "status";

  status.textContent=
    "Opening advertisement...";


  try{

    /*
      Adexium autoMode handles
      advertisement display.
    */

    if(
      adexiumWidget &&
      typeof adexiumWidget.showAd ===
      "function"
    ){

      adexiumWidget.showAd();

    }


    /*
      Give the widget time to open.
    */

    setTimeout(
      function(){

        button.disabled=false;

        button.textContent=
          "WATCH AD";

        card.style.opacity=
          "1";

        status.className=
          "status success";

        status.textContent=
          "Ad request sent to Adexium ✅";

        adLoading=false;

      },
      1500
    );


  }catch(error){

    console.log(
      "Adexium Error:",
      error
    );


    button.disabled=false;

    button.textContent=
      "WATCH AD";

    card.style.opacity=
      "1";

    status.className=
      "status error";

    status.textContent=
      "Ad error: "+
      (
        error.message ||
        "Unable to open ad"
      );

    adLoading=false;

  }

}

</script>


</body>
  </html>
