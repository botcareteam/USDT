<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Ads Orbit - Ad Test</title>


<!-- Telegram SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>


<!-- AdExora SDK - App ID 2189 -->
<script src="https://adexora.com/cdn/ads.js?id=2189"></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #202633;
}

.home{
  padding:20px;
}

.balanceBox{
  background:#111722;
  border:1px solid #252d3a;
  border-radius:18px;
  padding:22px;
  text-align:center;
  margin-bottom:25px;
}

.balanceTitle{
  color:#9aa4b2;
  font-size:14px;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
}

.network{
  color:#7f8998;
  font-size:12px;
}

.sectionTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.adCard{
  background:#111722;
  border:1px solid #2a3342;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  cursor:pointer;
  transition:.2s;
}

.adCard:active{
  transform:scale(.98);
}

.adTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.adTitle{
  font-size:16px;
  font-weight:bold;
}

.adReward{
  font-size:13px;
  color:#9da7b5;
  margin-top:8px;
}

.adButton{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:14px;
}

.status{
  text-align:center;
  margin-top:20px;
  color:#9da7b5;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
}

.success{
  color:#58e39b;
}

.error{
  color:#ff7070;
}

.info{
  color:#7db7ff;
}

</style>

</head>


<body>


<div class="header">
  ADS ORBIT / ONLINE
</div>


<div class="home">


  <!-- BALANCE -->

  <div class="balanceBox">

    <div class="balanceTitle">
      Total Earning
    </div>

    <div class="balance">
      <span id="balance">0.00</span> USDT
    </div>

    <div class="network">
      BEP20 Network
    </div>

  </div>


  <!-- ADS -->

  <div class="sectionTitle">
    📺 Ads Earning
  </div>


  <div
    class="adCard"
    id="adCard1"
    onclick="watchAd()"
  >

    <div class="adTop">

      <div class="adTitle">
        Advertisement #1
      </div>

      <div>
        🎁
      </div>

    </div>

    <div class="adReward">
      Watch advertisement to continue
    </div>

    <button
      class="adButton"
      id="adButton"
      type="button"
    >
      WATCH AD
    </button>

  </div>


  <!-- STATUS -->

  <div
    class="status info"
    id="status"
  >
    Checking AdExora SDK...
  </div>


</div>


<script>


/* ==============================
   TELEGRAM
============================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* ==============================
   ELEMENTS
============================== */

const status =
  document.getElementById("status");

const button =
  document.getElementById("adButton");

const card =
  document.getElementById("adCard1");


/* ==============================
   SDK CHECK
============================== */

if(
  typeof window.showAdexora ===
  "function"
){

  status.className =
    "status success";

  status.textContent =
    "AdExora SDK Loaded ✅";

}else{

  status.className =
    "status error";

  status.textContent =
    "AdExora SDK NOT Loaded ❌";

}


/* ==============================
   WATCH AD
============================== */

async function watchAd(){

  if(
    button.disabled
  ){

    return;

  }


  button.disabled=true;

  button.textContent=
    "LOADING...";

  card.style.opacity=
    "0.7";

  status.className=
    "status info";

  status.textContent=
    "Checking AdExora...";


  try{


    /* CHECK SDK */

    if(
      typeof window.showAdexora !==
      "function"
    ){

      throw new Error(
        "showAdexora function not found"
      );

    }


    status.textContent=
      "SDK found ✅ Opening advertisement...";


    /* OPEN AD */

    await window.showAdexora();


    /* SUCCESS */

    status.className=
      "status success";

    status.textContent=
      "AD COMPLETED SUCCESSFULLY ✅";


    button.textContent=
      "AD COMPLETED ✓";


  }catch(error){


    /* CONSOLE ERROR */

    console.log(
      "AdExora FULL ERROR:",
      error
    );


    console.log(
      "Error message:",
      error.message
    );


    console.log(
      "Error name:",
      error.name
    );


    /* SCREEN ERROR */

    status.className=
      "status error";

    status.textContent=
      "ERROR: " +
      (error.message || "Unknown error");


    button.disabled=false;

    button.textContent=
      "WATCH AD";


  }finally{

    card.style.opacity=
      "1";

  }

}


/* ==============================
   TELEGRAM READY
============================== */

if(
  tg &&
  typeof tg.ready ===
  "function"
){

  tg.ready();

}


</script>


</body>
  </html>
